name: Sam Android ARM64 Lab

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/sam-android-lab.yml"

permissions:
  contents: read

jobs:
  sam-app-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        shell: bash
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Download current Sam's Club China APK
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import html, re, urllib.request

          pages = [
              "https://m.app.so.com/detail/index?id=1633978&pname=cn.samsclub.app",
              "https://app.so.com/detail/index?id=1633978&pt=oauth",
          ]
          ua = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 Chrome/131 Safari/537.36"

          found = None
          last = ""
          for page in pages:
              req = urllib.request.Request(page, headers={"User-Agent": ua})
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode("utf-8", "ignore")
              raw = html.unescape(raw)
              last = raw
              urls = re.findall(
                  r'https://s\.shouji\.qihucdn\.com/[^"\'<>\s]+?cn\.samsclub\.app_\d+\.apk[^"\'<>\s]*',
                  raw,
              )
              if urls:
                  found = urls[0]
                  break

          if not found:
              open("download-page.html", "w", encoding="utf-8").write(last)
              raise SystemExit("Could not discover APK URL from the 360 app page")

          print("Discovered:", found.split("?")[0])
          req = urllib.request.Request(found, headers={"User-Agent": ua, "Referer": pages[0]})
          with urllib.request.urlopen(req, timeout=120) as r, open("sam.apk", "wb") as f:
              while True:
                  b = r.read(1024 * 1024)
                  if not b:
                      break
                  f.write(b)
          PY

          ls -lh sam.apk
          sha256sum sam.apk | tee sam-apk-sha256.txt

      - name: Verify package, version and signing certificate
        shell: bash
        run: |
          set -euxo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$AAPT" dump badging sam.apk | tee apk-badging.txt
          "$APKSIGNER" verify --print-certs sam.apk | tee apk-signing.txt

          grep -q "package: name='cn.samsclub.app'" apk-badging.txt
          grep -q "versionName='5.0.151'" apk-badging.txt

          EXPECTED_CERT="daef1c9db1528e60236b526aadf92642256ab102820d844cf2b8459cd5f94150"
          ACTUAL_CERT="$(grep -i 'certificate SHA-256 digest:' apk-signing.txt | head -1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          echo "Expected cert: $EXPECTED_CERT"
          echo "Actual cert:   $ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

          mkdir -p artifacts
          cp apk-badging.txt apk-signing.txt sam-apk-sha256.txt artifacts/

      - name: Prepare emulator automation
        shell: bash
        run: |
          cat > ui_find.py <<'PY'
          import argparse
          import re
          import sys
          import xml.etree.ElementTree as ET

          ap = argparse.ArgumentParser()
          ap.add_argument("xml")
          g = ap.add_mutually_exclusive_group(required=True)
          g.add_argument("--id")
          g.add_argument("--text-regex")
          args = ap.parse_args()

          try:
              root = ET.parse(args.xml).getroot()
          except Exception:
              sys.exit(1)

          for node in root.iter("node"):
              ok = False
              if args.id is not None:
                  ok = node.attrib.get("resource-id", "") == args.id
              else:
                  text = node.attrib.get("text", "") or node.attrib.get("content-desc", "")
                  try:
                      ok = re.search(args.text_regex, text, re.I) is not None
                  except re.error:
                      ok = False

              if not ok:
                  continue

              bounds = node.attrib.get("bounds", "")
              m = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
              if not m:
                  continue

              x1, y1, x2, y2 = map(int, m.groups())
              print((x1 + x2) // 2, (y1 + y2) // 2)
              sys.exit(0)

          sys.exit(1)
          PY

          cat > emulator_actions.sh <<'BASH'
          #!/usr/bin/env bash
          set -u

          mkdir -p artifacts

          refresh_ui() {
            adb shell uiautomator dump /sdcard/current.xml >/dev/null 2>&1 || return 1
            adb pull /sdcard/current.xml artifacts/current.xml >/dev/null 2>&1 || return 1
          }

          snapshot() {
            tag="$1"
            adb shell uiautomator dump "/sdcard/${tag}.xml" >/dev/null 2>&1 || true
            adb pull "/sdcard/${tag}.xml" "artifacts/${tag}.xml" >/dev/null 2>&1 || true
            adb exec-out screencap -p > "artifacts/${tag}.png" || true
          }

          tap_id() {
            rid="$1"
            refresh_ui || return 1
            xy="$(python3 ui_find.py artifacts/current.xml --id "$rid" 2>/dev/null)" || return 1
            echo "tap resource-id=$rid at $xy"
            adb shell input tap $xy
            return 0
          }

          tap_text() {
            pattern="$1"
            refresh_ui || return 1
            xy="$(python3 ui_find.py artifacts/current.xml --text-regex "$pattern" 2>/dev/null)" || return 1
            echo "tap text regex=$pattern at $xy"
            adb shell input tap $xy
            return 0
          }

          contains_text() {
            pattern="$1"
            refresh_ui || return 1
            python3 ui_find.py artifacts/current.xml --text-regex "$pattern" >/dev/null 2>&1
          }

          adb wait-for-device
          adb devices -l | tee artifacts/adb-devices.txt
          adb shell getprop ro.product.cpu.abi | tee artifacts/emulator-abi.txt
          adb shell getprop ro.product.cpu.abilist | tee artifacts/emulator-abilist.txt
          adb shell getprop ro.dalvik.vm.isa.arm64 | tee artifacts/arm64-translation.txt
          adb shell getprop ro.build.version.release | tee artifacts/android-version.txt

          echo "=== APK native ABIs ===" | tee artifacts/apk-native-abis.txt
          unzip -l sam.apk 'lib/*' | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u | tee -a artifacts/apk-native-abis.txt || true

          adb install -r -g sam.apk | tee artifacts/install.txt

          adb logcat -c
          adb shell monkey -p cn.samsclub.app -c android.intent.category.LAUNCHER 1 | tee artifacts/launch.txt || true
          sleep 25
          snapshot "00-launch"

          # Welcome screen
          tap_text '^(Skip|跳过)$' || true
          sleep 5
          snapshot "01-after-skip"

          # Privacy agreement: checkbox then Agree.
          tap_id 'cn.samsclub.app:id/iv_private_agreement' || true
          sleep 1
          tap_id 'cn.samsclub.app:id/dialog_confirm' || tap_text '^(Agree|同意)$' || true
          sleep 8
          snapshot "02-after-privacy"

          # Walk ordinary onboarding/ad UI forward.
          # If the login selector appears, open Mobile phone login exactly once,
          # then stop for inspection. We do NOT enter a phone number or solve any verification.
          for i in 1 2 3 4 5 6 7 8; do
            refresh_ui || true

            if python3 ui_find.py artifacts/current.xml --id 'cn.samsclub.app:id/fl_login_phone' >/dev/null 2>&1; then
              echo "Login selector detected at navigation pass $i" | tee artifacts/login-selector-detected.txt
              snapshot "03-login-selector"

              tap_id 'cn.samsclub.app:id/fl_login_phone' || true
              sleep 10
              snapshot "04-after-mobile-login"

              # Never hard-code the phone number in the workflow.
              # It must come from the repository Actions secret SAM_PHONE.
              if [ -z "${SAM_PHONE:-}" ]; then
                echo "SAM_PHONE secret is missing; stopped before entering credentials." | tee artifacts/sam-phone-secret-missing.txt
                snapshot "sam-phone-secret-missing"
                break
              fi

              refresh_ui || true
              if python3 ui_find.py artifacts/current.xml --id 'cn.samsclub.app:id/login_et_phone' >/dev/null 2>&1; then
                tap_id 'cn.samsclub.app:id/login_et_phone' || true
                adb shell input text "$SAM_PHONE"
                sleep 1

                # Tick the ordinary login agreement checkbox if present.
                tap_id 'cn.samsclub.app:id/login_im_agreement' || true
                sleep 1

                snapshot "05-phone-entered"

                # Request the SMS code exactly once, then stop and inspect.
                tap_id 'cn.samsclub.app:id/login_tv_get_sms_code' || true
                sleep 12
                snapshot "06-after-get-code"

                if contains_text '(安全验证|真人验证|拼图|滑块|拖动滑块|请完成验证|图形验证|captcha|slider|puzzle)'; then
                  echo "Human/security verification detected after requesting SMS code. Automation stopped; no bypass attempted." | tee artifacts/human-verification-detected.txt
                  snapshot "human-verification-detected"
                elif contains_text '(短信已发送|验证码已发送|重新获取|秒后重试|重新发送|sent|resend)'; then
                  echo "SMS code appears to have been requested successfully. Automation stopped before entering any SMS code." | tee artifacts/sms-code-requested.txt
                  snapshot "sms-code-requested"
                else
                  echo "Get Code was tapped, but the resulting page/state was not confidently identified." | tee artifacts/get-code-result-unknown.txt
                  snapshot "get-code-result-unknown"
                fi
              else
                echo "Phone input control was not found after opening Mobile phone login." | tee artifacts/phone-input-not-found.txt
                snapshot "phone-input-not-found"
              fi
              break
            fi

            tapped=0
            for pattern in \
              '^(Skip|跳过)$' \
              '^(Close|关闭)$' \
              '^(Agree|同意)$' \
              '^(我知道了|知道了|Got it)$' \
              '^(以后再说|稍后|Not now)$'
            do
              if tap_text "$pattern"; then
                tapped=1
                sleep 4
                break
              fi
            done

            snapshot "nav-${i}"
            if [ "$tapped" -eq 0 ]; then
              sleep 6
            fi
          done

          snapshot "99-final"

          adb shell dumpsys activity activities > artifacts/activity.txt || true
          adb shell dumpsys package cn.samsclub.app > artifacts/package.txt || true

          echo "=== DNS / route ===" > artifacts/network.txt
          adb shell getprop | grep -i dns >> artifacts/network.txt || true
          adb shell ip route >> artifacts/network.txt || true
          echo "=== Sam API reachability ===" >> artifacts/network.txt
          adb shell ping -c 1 api-sams.walmartmobile.cn >> artifacts/network.txt 2>&1 || true

          adb logcat -d -v time > artifacts/logcat.txt || true
          grep -iE 'api-sams|walmartmobile|samsclub|UnknownHost|SSLHandshake|NetworkSecurityConfig|AndroidRuntime|FATAL EXCEPTION|crash' \
            artifacts/logcat.txt > artifacts/logcat-focus.txt || true

          echo "=== Foreground ===" > artifacts/summary.txt
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' >> artifacts/summary.txt || true
          echo "=== Final UI text ===" >> artifacts/summary.txt
          if [ -f artifacts/99-final.xml ]; then
            grep -o 'text="[^"]*"' artifacts/99-final.xml | head -200 >> artifacts/summary.txt || true
          fi
          BASH

          chmod +x emulator_actions.sh
          python3 -m py_compile ui_find.py
          bash -n emulator_actions.sh

      - name: Boot Android 35 x86_64, request Sam SMS code and inspect verification
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SAM_PHONE: ${{ secrets.SAM_PHONE }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none -no-metrics
          script: bash emulator_actions.sh

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam-android-lab-results
          path: |
            artifacts/
            download-page.html
          if-no-files-found: ignore
          retention-days: 3
