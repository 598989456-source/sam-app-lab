name: Sam Android ARM64 Lab

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/sam-android-lab.yml"

permissions:
  contents: read

jobs:
  sam-app-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        shell: bash
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Download current Sam's Club China APK
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import html, re, urllib.request

          pages = [
              "https://m.app.so.com/detail/index?id=1633978&pname=cn.samsclub.app",
              "https://app.so.com/detail/index?id=1633978&pt=oauth",
          ]
          ua = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 Chrome/131 Safari/537.36"

          found = None
          last = ""
          for page in pages:
              req = urllib.request.Request(page, headers={"User-Agent": ua})
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode("utf-8", "ignore")
              raw = html.unescape(raw)
              last = raw
              urls = re.findall(
                  r'https://s\.shouji\.qihucdn\.com/[^"\'<>\s]+?cn\.samsclub\.app_\d+\.apk[^"\'<>\s]*',
                  raw,
              )
              if urls:
                  found = urls[0]
                  break

          if not found:
              open("download-page.html", "w", encoding="utf-8").write(last)
              raise SystemExit("Could not discover APK URL from the 360 app page")

          print("Discovered:", found.split("?")[0])
          req = urllib.request.Request(found, headers={"User-Agent": ua, "Referer": pages[0]})
          with urllib.request.urlopen(req, timeout=120) as r, open("sam.apk", "wb") as f:
              while True:
                  b = r.read(1024 * 1024)
                  if not b:
                      break
                  f.write(b)
          PY

          ls -lh sam.apk
          sha256sum sam.apk | tee sam-apk-sha256.txt

      - name: Verify package, version and signing certificate
        shell: bash
        run: |
          set -euxo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$AAPT" dump badging sam.apk | tee apk-badging.txt
          "$APKSIGNER" verify --print-certs sam.apk | tee apk-signing.txt

          grep -q "package: name='cn.samsclub.app'" apk-badging.txt
          grep -q "versionName='5.0.151'" apk-badging.txt

          EXPECTED_CERT="daef1c9db1528e60236b526aadf92642256ab102820d844cf2b8459cd5f94150"
          ACTUAL_CERT="$(grep -i 'certificate SHA-256 digest:' apk-signing.txt | head -1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          echo "Expected cert: $EXPECTED_CERT"
          echo "Actual cert:   $ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

          mkdir -p artifacts
          cp apk-badging.txt apk-signing.txt sam-apk-sha256.txt artifacts/

      - name: Boot Android 35 x86_64 with ARM translation, install and launch Sam app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none -no-metrics
          script: |
            mkdir -p artifacts
            adb wait-for-device
            adb devices -l | tee artifacts/adb-devices.txt
            adb shell getprop ro.product.cpu.abi | tee artifacts/emulator-abi.txt
            adb shell getprop ro.product.cpu.abilist | tee artifacts/emulator-abilist.txt
            adb shell getprop ro.dalvik.vm.isa.arm64 | tee artifacts/arm64-translation.txt
            adb shell getprop ro.build.version.release | tee artifacts/android-version.txt
            echo "=== APK native ABIs ===" | tee artifacts/apk-native-abis.txt
            unzip -l sam.apk 'lib/*' | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u | tee -a artifacts/apk-native-abis.txt || true
            adb install -r -g sam.apk | tee artifacts/install.txt
            adb logcat -c
            adb shell monkey -p cn.samsclub.app -c android.intent.category.LAUNCHER 1 | tee artifacts/launch.txt || true
            sleep 25
            adb shell uiautomator dump /sdcard/window-before-skip.xml || true
            adb pull /sdcard/window-before-skip.xml artifacts/window-before-skip.xml || true
            adb exec-out screencap -p > artifacts/screen-before-skip.png || true
            adb shell input tap 969 180 || true
            sleep 10
            adb shell uiautomator dump /sdcard/window-after-skip.xml || true
            adb pull /sdcard/window-after-skip.xml artifacts/window-after-skip.xml || true
            adb exec-out screencap -p > artifacts/screen-after-skip.png || true
            adb shell dumpsys activity activities > artifacts/activity.txt || true
            adb shell dumpsys package cn.samsclub.app > artifacts/package.txt || true
            echo "=== DNS / route ===" > artifacts/network.txt
            adb shell getprop | grep -i dns >> artifacts/network.txt || true
            adb shell ip route >> artifacts/network.txt || true
            echo "=== Sam API reachability ===" >> artifacts/network.txt
            adb shell ping -c 1 api-sams.walmartmobile.cn >> artifacts/network.txt 2>&1 || true
            adb logcat -d -v time > artifacts/logcat.txt || true
            grep -iE 'api-sams|walmartmobile|samsclub|UnknownHost|SSLHandshake|NetworkSecurityConfig|AndroidRuntime|FATAL EXCEPTION|crash' artifacts/logcat.txt > artifacts/logcat-focus.txt || true
            echo "=== Foreground ===" > artifacts/summary.txt
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' >> artifacts/summary.txt || true
            echo "=== UI before Skip ===" >> artifacts/summary.txt
            grep -o 'text="[^"]*"' artifacts/window-before-skip.xml | head -100 >> artifacts/summary.txt || true
            echo "=== UI after Skip ===" >> artifacts/summary.txt
            grep -o 'text="[^"]*"' artifacts/window-after-skip.xml | head -150 >> artifacts/summary.txt || true

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam-android-lab-results
          path: |
            artifacts/
            download-page.html
          if-no-files-found: ignore
          retention-days: 3
